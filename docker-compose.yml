services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: filotakip-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:?.env dosyasinda SA_PASSWORD tanimli degil}"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build: ./FiloTakipWebApi
    container_name: filotakip-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__FiloTakipVeritabani: "Server=db,1433;Database=FiloTakipDb2;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__Anahtar: "${JWT_ANAHTAR:?.env dosyasinda JWT_ANAHTAR tanimli degil}"
      Admin__Sifre: "${ADMIN_SIFRE:-}"
    ports:
      - "5223:8080"
    volumes:
      - uploads:/app/wwwroot/uploads

  frontend:
    build: ./FiloTakipFrontend
    container_name: filotakip-frontend
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  sqldata:
  uploads:
